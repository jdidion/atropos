[build-system]
requires = ["setuptools>=64", "Cython>=0.25.2"]
build-backend = "setuptools.build_meta"

[project]
name = "atropos"
version = "1.1.29"
description = "trim adapters from high-throughput sequencing reads"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "John Didion", email = "john.didion@nih.gov"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "License :: Public Domain",
    "Natural Language :: English",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://atropos.readthedocs.org/"
Repository = "https://github.com/jdidion/atropos"

[project.scripts]
atropos = "atropos.commands:execute_cli_main"

[project.optional-dependencies]
progressbar = ["progressbar2"]
tqdm = ["tqdm"]
khmer = ["khmer"]
pysam = ["pysam"]
jinja = ["jinja2"]
sra = ["srastream>=0.1.3"]
test = ["pytest", "pytest-timeout"]

[tool.setuptools.packages.find]
include = ["atropos*"]

[tool.setuptools.package-data]
atropos = ["adapters/*.fa", "commands/**/templates/*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
